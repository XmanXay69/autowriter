# XcodeGen turns this file into AutoWriter.xcodeproj (run `xcodegen generate`,
# or just use scripts/build.sh, which does it for you).
name: AutoWriter
options:
  bundleIdPrefix: com.xmanxay
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "4"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEAD_CODE_STRIPPING: YES
    # Xcode signs "ad hoc"; scripts/build.sh then re-signs with your Apple
    # Development certificate so macOS remembers the Accessibility permission.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  AutoWriter:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_NAME: AutoWriter
        PRODUCT_BUNDLE_IDENTIFIER: com.xmanxay.AutoWriter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: AutoWriter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 XmanXay69. MIT License."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Not sandboxed: macOS doesn't let sandboxed apps type into other apps.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        COMBINE_HIDPI_IMAGES: YES
  AutoWriterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      # The tests compile the app's "Core" files (the parts with no window or
      # permissions) directly, so they run without opening the app.
      - path: App/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xmanxay.AutoWriterTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
schemes:
  AutoWriter:
    build:
      targets:
        AutoWriter: all
    run:
      config: Debug
    test:
      targets:
        - AutoWriterTests
